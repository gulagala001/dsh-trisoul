# TriSoul 挂载补丁（发行版模板）
#
# 由 `trisoul init` 复制到 <DSH_HOME>/profiles/trisoul/cordis.patch.yml，
# 其中 __DATA_DIR__ 会被替换成安装目录下的 data/ 绝对路径。
#
# 关于模型路由：这里统一写 `deepseek-official` —— 那是 dsh 内置的 DeepSeek 官方 provider，
# 无需在 settings.yaml 里再声明一遍（手写一份缺 api/baseURL 的定义反而会让整个 providers
# 段校验失败，连内置的一起丢掉）。API key 在网页「设置 → 模型」里填即可。
# 想换别的渠道：把下面所有 provider/model 改成你自己的 provider id 与模型名。
# 注意：TriSoul 的盲写协议要求模型能稳定输出 JSON，做不到的渠道不适配。

# 取消按新旧的自动压缩（TriSoul 架构核心：改由手术刀按内容动刀）
- id: compaction-basic
  disabled: true

# 上下文手术刀
- insert:
    - id: trisoul-surgeon
      name: '@trisoul/dsh-surgeon'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

# 画布编排器（阈值用插件默认：触发阈 = 主模型上下文窗口 × 0.5，keepTail 30）
- insert:
    - id: trisoul-canvas
      name: '@trisoul/dsh-canvas'

# 安全门（共识 ≠ 授权：三个灵魂一致同意的危险动作也要被拦）
- insert:
    - id: trisoul-guard
      name: '@trisoul/dsh-guard'

# 记忆中枢
- insert:
    - id: trisoul-memory
      name: '@trisoul/dsh-memory'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
        storePath: __DATA_DIR__/trisoul-memory.json

# 三体共识（三个灵魂同模型不同温度；人设 = 做事取舍：求稳 / 求成 / 求全，无人格无口头禅）
- insert:
    - id: trisoul-consensus
      name: '@trisoul/dsh-consensus'
      config:
        souls:
          - { name: A, provider: deepseek-official, model: deepseek-v4-flash, temperature: 0.3,
              persona: '做事以正确为先：只做请求明确要求的，不确定的先核实或明说，宁可少做也不做错；动手前先确认现状与影响面，存在多个可行方案时选可逆、当场可验证的那条。' }
          - { name: B, provider: deepseek-official, model: deepseek-v4-flash, temperature: 0.6,
              persona: '做事以把事办成为先：走主流程、用最直接的做法，能用就交付，不为边角情况拖住主线；存在多个可行方案时选步骤最少、依赖最少的那条直接落地。' }
          - { name: C, provider: deepseek-official, model: deepseek-v4-flash, temperature: 0.9,
              persona: '做事以周全为先：同样完成任务，但主动覆盖异常、边界和请求里没说透的隐含要求，宁可多想一步；存在多个可行方案时优先探索与最直接做法不同的那条并说明理由。' }

# API 后端（Web UI 的监控 / 设置 / 记忆接口）
- insert:
    - id: trisoul-api
      name: '@trisoul/dsh-api'
      config:
        sessionStorePath: __DATA_DIR__/trisoul-sessions.json
        # 模型配置默认值；设置页保存后由用户层覆盖（统一模式 / 精细模式可在会话界面切换）
        base:
          mode: unified
          unified: { provider: deepseek-official, model: deepseek-v4-flash }
          souls:
            - { name: A, title: 求稳, temperature: 0.3,
                persona: '做事以正确为先：只做请求明确要求的，不确定的先核实或明说，宁可少做也不做错；动手前先确认现状与影响面，存在多个可行方案时选可逆、当场可验证的那条。' }
            - { name: B, title: 求成, temperature: 0.6,
                persona: '做事以把事办成为先：走主流程、用最直接的做法，能用就交付，不为边角情况拖住主线；存在多个可行方案时选步骤最少、依赖最少的那条直接落地。' }
            - { name: C, title: 求全, temperature: 0.9,
                persona: '做事以周全为先：同样完成任务，但主动覆盖异常、边界和请求里没说透的隐含要求，宁可多想一步；存在多个可行方案时优先探索与最直接做法不同的那条并说明理由。' }

# Web UI 客户端插件（记忆面板 / 监控 tab / 设置分区）
- insert:
    - id: trisoul-memory-ui
      name: '@trisoul/dsh-client-memory-ui'

- insert:
    - id: trisoul-monitor
      name: '@trisoul/dsh-client-monitor'

- insert:
    - id: trisoul-settings
      name: '@trisoul/dsh-client-settings'

# web_fetch 的干活组件：dsh-base 只挂了 web 服务与搜索 provider，fetch provider 一个都没挂，
# 不挂它的话工具在、干活的不在（WEB_PROVIDER_UNAVAILABLE）。
# 上游明示的缺口：该 provider 不做 SSRF / 内网拦截，能打到 127.0.0.1 与内网地址。
- insert:
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

# fetch provider 写死成 http（不吃「只注册了一个就自动选中」的隐式规则）。
# patch 的 config 是整键替换而非深合并，所以 searchProvider 必须一起重述，
# 否则会把 dsh-base 里的默认值覆盖掉。
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http
