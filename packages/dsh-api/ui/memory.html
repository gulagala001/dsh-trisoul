<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriSoul 记忆中枢</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0F1117;
      color: #E5E7EB;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1E222E;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #F9FAFB;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6B7280;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      flex: 1;
      background: #171A23;
      border: 1px solid #1E222E;
      border-radius: 8px;
      padding: 16px;
    }

    .stat-label {
      font-size: 12px;
      color: #6B7280;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #FBBF24;
    }

    .search-bar {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: #171A23;
      border: 1px solid #1E222E;
      border-radius: 6px;
      color: #E5E7EB;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #FBBF24;
    }

    .search-button {
      padding: 12px 24px;
      background: #FBBF24;
      color: #0F1117;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .search-button:hover {
      background: #F59E0B;
    }

    .memories {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memory-card {
      background: #171A23;
      border: 1px solid #1E222E;
      border-radius: 8px;
      padding: 16px;
      position: relative;
    }

    .memory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .memory-id {
      font-size: 12px;
      color: #6B7280;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
    }

    .memory-time {
      font-size: 12px;
      color: #9CA3AF;
    }

    .memory-text {
      font-size: 14px;
      line-height: 1.6;
      color: #E5E7EB;
    }

    .memory-text mark {
      background: #FBBF24;
      color: #0F1117;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6B7280;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">TriSoul 记忆中枢</h1>
      <div class="subtitle">长期记忆库可视化</div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">记忆总数</div>
        <div class="stat-value" id="total-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最近更新</div>
        <div class="stat-value" id="last-update" style="font-size: 16px;">--</div>
      </div>
    </div>

    <div class="search-bar">
      <input
        type="text"
        class="search-input"
        id="search-input"
        placeholder="搜索记忆内容..."
      />
      <button class="search-button" onclick="search()">搜索</button>
    </div>

    <div id="loading" class="loading">加载中...</div>
    <div id="memories" class="memories" style="display: none;"></div>
    <div id="empty" class="empty" style="display: none;">暂无记忆</div>
  </div>

  <script>
    let allMemories = []
    let searchQuery = ''

    function formatTime(timestamp) {
      if (!timestamp) return '--'
      const date = new Date(timestamp)
      const now = new Date()
      const diff = Math.floor((now - date) / 1000)

      if (diff < 60) return '刚刚'
      if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`
      if (diff < 86400) return `${Math.floor(diff / 3600)}小时前`

      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      })
    }

    function highlightText(text, query) {
      if (!query) return text
      const regex = new RegExp(`(${query})`, 'gi')
      return text.replace(regex, '<mark>$1</mark>')
    }

    async function loadMemories() {
      try {
        const response = await fetch('/api/memory/list')
        if (!response.ok) throw new Error('加载失败')
        const data = await response.json()
        allMemories = data.memories || []
        renderMemories()
      } catch (e) {
        console.error('Failed to load memories:', e)
      }
    }

    function renderMemories() {
      const loading = document.getElementById('loading')
      const memories = document.getElementById('memories')
      const empty = document.getElementById('empty')
      const totalCount = document.getElementById('total-count')
      const lastUpdate = document.getElementById('last-update')

      loading.style.display = 'none'

      // 过滤记忆
      let filtered = allMemories
      if (searchQuery) {
        filtered = allMemories.filter(m =>
          m.text.toLowerCase().includes(searchQuery.toLowerCase())
        )
      }

      // 更新统计
      totalCount.textContent = allMemories.length
      if (allMemories.length > 0) {
        const latest = Math.max(...allMemories.map(m => m.timestamp))
        lastUpdate.textContent = formatTime(latest)
      }

      // 渲染记忆列表
      if (filtered.length === 0) {
        memories.style.display = 'none'
        empty.style.display = 'block'
        empty.textContent = searchQuery ? '未找到匹配的记忆' : '暂无记忆'
        return
      }

      empty.style.display = 'none'
      memories.style.display = 'flex'

      // 按时间倒序
      filtered.sort((a, b) => b.timestamp - a.timestamp)

      memories.innerHTML = filtered.map((m, idx) => `
        <div class="memory-card">
          <div class="memory-header">
            <div class="memory-id">#${filtered.length - idx}</div>
            <div class="memory-time">${formatTime(m.timestamp)}</div>
          </div>
          <div class="memory-text">${highlightText(m.text, searchQuery)}</div>
        </div>
      `).join('')
    }

    function search() {
      searchQuery = document.getElementById('search-input').value.trim()
      renderMemories()
    }

    // 回车搜索
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') search()
    })

    // 首次加载
    loadMemories()

    // 每 30 秒刷新一次
    setInterval(loadMemories, 30000)
  </script>
</body>
</html>
