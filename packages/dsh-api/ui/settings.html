<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriSoul AI 配置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0F1117;
      color: #E5E7EB;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1E222E;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #F9FAFB;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6B7280;
    }

    .section {
      background: #171A23;
      border: 1px solid #1E222E;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #F9FAFB;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #9CA3AF;
      font-weight: 500;
    }

    .input {
      width: 100%;
      padding: 12px 16px;
      background: #0F1117;
      border: 1px solid #1E222E;
      border-radius: 6px;
      color: #E5E7EB;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input:focus {
      border-color: #FBBF24;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .slider {
      flex: 1;
      height: 6px;
      background: #1E222E;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: #FBBF24;
      border-radius: 50%;
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #FBBF24;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .slider-value {
      font-size: 14px;
      font-weight: 600;
      color: #FBBF24;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      min-width: 36px;
      text-align: right;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    .button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .button-primary {
      background: #FBBF24;
      color: #0F1117;
    }

    .button-primary:hover:not(:disabled) {
      background: #F59E0B;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 14px 18px;
      background: #171A23;
      border: 1px solid #1E222E;
      border-radius: 6px;
      color: #E5E7EB;
      font-size: 14px;
    }

    .message.success {
      border-color: #34D399;
      background: rgba(52, 211, 153, 0.1);
    }

    .message.error {
      border-color: #F87171;
      background: rgba(248, 113, 113, 0.1);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">TriSoul AI 配置</h1>
      <div class="subtitle">单独配置 5 个后台 AI 的参数</div>
    </div>

    <div id="loading" class="loading">加载中...</div>
    <div id="content" style="display: none;"></div>
  </div>

  <script>
    let config = { ais: [] }

    async function loadConfig() {
      try {
        const response = await fetch('/api/settings/config')
        if (!response.ok) throw new Error('加载失败')
        config = await response.json()
        renderConfig()
      } catch (e) {
        console.error('Failed to load config:', e)
        showMessage('加载配置失败', 'error')
      }
    }

    function renderConfig() {
      const content = document.getElementById('content')
      const loading = document.getElementById('loading')

      content.innerHTML = config.ais.map((ai, idx) => `
        <div class="section">
          <h2 class="section-title">${ai.name}</h2>

          <div class="field">
            <label class="label">Provider</label>
            <input
              type="text"
              class="input"
              value="${ai.provider}"
              data-idx="${idx}"
              data-field="provider"
            />
          </div>

          <div class="field">
            <label class="label">Model</label>
            <input
              type="text"
              class="input"
              value="${ai.model}"
              data-idx="${idx}"
              data-field="model"
            />
          </div>

          <div class="field">
            <label class="label">Temperature</label>
            <div class="slider-container">
              <input
                type="range"
                class="slider"
                min="0"
                max="2"
                step="0.1"
                value="${ai.temperature}"
                data-idx="${idx}"
                data-field="temperature"
              />
              <span class="slider-value" id="temp-${idx}">${ai.temperature.toFixed(1)}</span>
            </div>
          </div>
        </div>
      `).join('') + `
        <div class="actions">
          <button class="button button-primary" onclick="saveConfig()">保存配置</button>
        </div>
        <div id="message" style="display: none;"></div>
      `

      // 绑定事件
      content.querySelectorAll('.input, .slider').forEach(el => {
        el.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.idx)
          const field = e.target.dataset.field
          const value = field === 'temperature' ? parseFloat(e.target.value) : e.target.value
          config.ais[idx][field] = value

          if (field === 'temperature') {
            document.getElementById(`temp-${idx}`).textContent = value.toFixed(1)
          }
        })
      })

      loading.style.display = 'none'
      content.style.display = 'block'
    }

    async function saveConfig() {
      const button = event.target
      button.disabled = true
      button.textContent = '保存中...'

      try {
        const response = await fetch('/api/settings/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config),
        })

        const result = await response.json()

        if (result.success) {
          showMessage(result.message || '保存成功', 'success')
        } else {
          showMessage(result.error || '保存失败', 'error')
        }
      } catch (e) {
        showMessage(`保存失败: ${e.message}`, 'error')
      } finally {
        button.disabled = false
        button.textContent = '保存配置'
      }
    }

    function showMessage(text, type = '') {
      const message = document.getElementById('message')
      message.textContent = text
      message.className = `message ${type}`
      message.style.display = 'block'

      setTimeout(() => {
        message.style.display = 'none'
      }, 5000)
    }

    // 首次加载
    loadConfig()
  </script>
</body>
</html>
